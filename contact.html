      <h1>// transmit message</h1>
      <p class="center muted" style="max-width:560px;margin:0 auto 2rem;">Got a question, a collab idea, or just want to say hi? Drop a line.</p>

      <div class="card" style="max-width:620px;margin:0 auto;">
        <form id="contact-form" action="https://formspree.io/f/YOUR_CONTACT_FORM_ID" method="POST">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required placeholder="Your name">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="_replyto" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required placeholder="What's on your mind?"></textarea>
          </div>
          <input type="hidden" name="_next" value="https://gsxr-404.godaddysites.com/thanks.html">
          <button type="submit" class="btn btn-block btn-pink">✦ Send Transmission</button>
          <p class="form-note">I'll get back to you soon. No bots, promise.</p>
        </form>
      </div>

      <p class="center muted" style="margin-top:2rem;">📡 Based somewhere on Earth — happy to chat virtually or in-person.</p>
    </div>
