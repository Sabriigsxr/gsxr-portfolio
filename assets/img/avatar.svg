    <rect x="124" y="40" width="8" height="8"/>
    <!-- Right side bottom -->
    <rect x="108" y="120" width="8" height="8"/><rect x="116" y="120" width="8" height="8"/>
    <rect x="116" y="128" width="8" height="8"/><rect x="108" y="128" width="8" height="8"/>
  </g>

  <!-- Pink accent on middle bar -->
  <g fill="#FF71CE">
    <rect x="52" y="88" width="8" height="8"/><rect x="60" y="88" width="8" height="8"/>
    <rect x="68" y="88" width="8" height="8"/><rect x="76" y="88" width="8" height="8"/>
    <rect x="84" y="88" width="8" height="8"/><rect x="92" y="88" width="8" height="8"/>
    <rect x="100" y="88" width="8" height="8"/>
