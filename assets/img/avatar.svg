    <rect x="52" y="32" width="8" height="8"/><rect x="60" y="32" width="8" height="8"/>
    <rect x="68" y="32" width="8" height="8"/><rect x="76" y="32" width="8" height="8"/>
    <rect x="84" y="32" width="8" height="8"/><rect x="92" y="32" width="8" height="8"/>
    <rect x="100" y="32" width="8" height="8"/><rect x="108" y="32" width="8" height="8"/>
    <!-- Left side -->
    <rect x="44" y="40" width="8" height="8"/><rect x="44" y="48" width="8" height="8"/>
    <rect x="44" y="56" width="8" height="8"/><rect x="44" y="64" width="8" height="8"/>
    <rect x="44" y="72" width="8" height="8"/><rect x="44" y="80" width="8" height="8"/>
    <rect x="44" y="88" width="8" height="8"/><rect x="44" y="96" width="8" height="8"/>
    <rect x="44" y="104" width="8" height="8"/><rect x="44" y="112" width="8" height="8"/>
    <rect x="44" y="120" width="8" height="8"/><rect x="44" y="128" width="8" height="8"/>
    <rect x="44" y="136" width="8" height="8"/><rect x="44" y="144" width="8" height="8"/>
