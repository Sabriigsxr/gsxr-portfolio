    <rect x="68" y="40" width="8" height="8"/><rect x="76" y="40" width="8" height="8"/>
    <rect x="84" y="40" width="8" height="8"/><rect x="92" y="40" width="8" height="8"/>
    <rect x="100" y="40" width="8" height="8"/><rect x="108" y="40" width="8" height="8"/>
